name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: tag for new version

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Build archives
        run: |
          for dir in target/*/
          do
            TARGET_TRIPLE=$(basename $dir)
            if [ "$TARGET_TRIPLE" == 'release' ]; then
              continue
            fi
            if [ "$TARGET_TRIPLE" == 'maturin' ]; then
              continue
            fi
            ARCHIVE_FILE=nbimgextract-${TARGET_TRIPLE}.tar.gz
            echo $ARCHIVE_FILE
            tar czvf $ARCHIVE_FILE -C ${dir}release nbimgextract
            shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: "Upload binary"
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
