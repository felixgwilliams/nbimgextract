      - name: Build archives
        run: |
          for dir in target/*/
          do
            TARGET_TRIPLE=$(basename $dir)
            if [ "$TARGET_TRIPLE" == 'release' ]; then
              continue
            fi
            if [ "$TARGET_TRIPLE" == 'maturin' ]; then
              continue
            fi
            ARCHIVE_FILE=nbimgextract-${TARGET_TRIPLE}.tar.gz
            echo $ARCHIVE_FILE
            tar czvf $ARCHIVE_FILE -C ${dir}release nbimgextract
            shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: "Upload binary"
        uses: actions/upload-artifact@v7
        with:
          name: binaries-musllinux-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256
  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build archives
        shell: bash
        run: |
          for dir in target/*/
          do
            TARGET_TRIPLE=$(basename $dir)
            if [ "$TARGET_TRIPLE" == 'release' ]; then
              continue
            fi
            if [ "$TARGET_TRIPLE" == 'maturin' ]; then
              continue
            fi
            ARCHIVE_FILE=nbimgextract-${TARGET_TRIPLE}.zip
            echo $ARCHIVE_FILE
            7z a $ARCHIVE_FILE ./${dir}release/nbimgextract.exe
            sha256sum $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: "Upload binary"
        uses: actions/upload-artifact@v7
        with:
          name: binaries-windows-${{ matrix.platform.target }}
          path: |
