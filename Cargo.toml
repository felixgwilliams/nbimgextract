[package]
name = "nbimgextract"
version = "0.3.1"
edition = "2021"
rust-version = "1.91"
description = "A command-line tool for extracting images from Jupyter Notebooks."
readme = "README.md"
homepage = "https://github.com/felixgwilliams/nbimgextract"
repository = "https://github.com/felixgwilliams/nbimgextract"
license = "MIT"
keywords = ["jupyter", "notebook", "python"]
categories = ["command-line-utilities", "development-tools"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["color", "derive"] }
colored = "3.0.0"
indexmap = { version = "2.9.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order", "raw_value"] }
tl = "0.7.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"

[lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
panic_in_result_fn = "deny"
pedantic = { level = "deny", priority = -1 }
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
# DENY PANICS
unwrap_used = "deny"
